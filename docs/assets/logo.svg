<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t d" width="240" height="240">
<!--
  Wordmark. The single typographic decision is a colour split at the morpheme
  boundary of the compound name: "slo" in track green #2f6f4f (budget you still
  hold) and "budget" in ink #1f2933 (neutral). One accent, red #c0392b, appears
  in exactly one place: the small depleted segment of the budget bar beneath the
  word, the thing the reader should read as spent. Colours match the burndown
  diagram so the set reads as one project. Flat fills, no gradient, no blur.
-->
<title id="t">slobudget</title>
<desc id="d">The word slobudget with slo in green and budget in dark ink, above a horizontal bar that is mostly green with a small red spent segment on the right, a literal error budget bar.</desc>
<rect x="0" y="0" width="240" height="240" fill="#ffffff"/>
<text x="24" y="120" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700">
<tspan fill="#2f6f4f">slo</tspan><tspan fill="#1f2933">budget</tspan>
</text>
<!-- error budget bar: 80 percent held (green), 20 percent spent (red accent) -->
<rect x="24" y="144" width="153.6" height="12" rx="3" fill="#2f6f4f"/>
<rect x="177.6" y="144" width="38.4" height="12" rx="3" fill="#c0392b"/>
<text x="24" y="184" font-family="&quot;Cascadia Mono&quot;, &quot;JetBrains Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace" font-size="12" fill="#1f2933">error budget accounting</text>
</svg>

