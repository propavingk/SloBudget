<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d" width="640" height="320">
<!--
  Colours derived from the subject: a burndown of error budget.
  ink #1f2933 for text and axes (neutral), track #2f6f4f green for budget still
  held (safe), accent #c0392b red used once for the incident band and the final
  marker, the single thing the reader should look at. Two cores plus one accent.
  Flat fills only. No gradients, no blur, no glow, no grid paper.
-->
<title id="t">slobudget error budget burndown for service-a</title>
<desc id="d">Remaining error budget as a share of a 98 percent objective over a four hour window with five minute intervals. The line holds near 100 percent for the first hour, drops sharply from 99.38 percent to 30.63 percent during a thirty minute incident, tapers during recovery, and ends at 20.0 percent remaining.</desc>
<rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
<!-- incident band, accent used once as a region highlight -->
<rect x="204.77" y="48" width="55.32" height="208" fill="#f7e2df"/>
<!-- axes -->
<line x1="72" y1="48" x2="72" y2="256" stroke="#1f2933" stroke-width="1"/>
<line x1="72" y1="256" x2="592" y2="256" stroke="#1f2933" stroke-width="1"/>
<line x1="72" y1="48.00" x2="592" y2="48.00" stroke="#d7dde2" stroke-width="1"/>
<text x="64" y="52.00" text-anchor="end" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933">100%</text>
<line x1="72" y1="100.00" x2="592" y2="100.00" stroke="#d7dde2" stroke-width="1"/>
<text x="64" y="104.00" text-anchor="end" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933">75%</text>
<line x1="72" y1="152.00" x2="592" y2="152.00" stroke="#d7dde2" stroke-width="1"/>
